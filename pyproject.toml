[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testpilot-ai"
version = "0.1.0"
description = "Intelligent test generation framework using AST analysis and optional LLM enhancement"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Maharshi Soni"}
]
keywords = ["testing", "pytest", "ast", "code-analysis", "test-generation", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.scripts]
testpilot = "testpilot.cli:main"

[project.entry-points."pytest11"]
testpilot = "testpilot.plugin"

[project.urls]
Homepage = "https://github.com/msoni029/testpilot-ai"
Repository = "https://github.com/msoni029/testpilot-ai"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
testpilot = ["py.typed", "templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py310"
line-length = 99
